<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <!-- Gradient definitions for premium look -->
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="100%" stop-color="#14532D" />
    </linearGradient>
    <linearGradient id="gold-grad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FACC15" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="0" y1="0" x2="0" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- Premium rounded card background with border glow -->
  <rect x="2" y="2" width="44" height="44" rx="14" fill="url(#bg-grad)" />
  <rect x="2" y="2" width="44" height="44" rx="14" stroke="url(#glow-grad)" stroke-width="1.5" />
  
  <!-- Subtle gold decorative accent at the bottom -->
  <path d="M 2 38 C 12 41, 36 41, 46 38" stroke="url(#gold-grad)" stroke-width="3" stroke-linecap="round" opacity="0.9" />

  <!-- Modern Geometric "G" Icon -->
  <path d="M 33 18 C 30.5 14.5, 25.5 13, 21 14.5 C 16.5 16, 13.5 20.5, 13.5 25.5 C 13.5 30.5, 17.5 34.5, 22.5 34.5 C 27.5 34.5, 31.5 30.5, 31.5 25.5 L 22.5 25.5" 
        stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
</svg>