<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GUTT SYSTEM</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="apple-touch-icon" href="/favicon.svg">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#14532D">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f1f5f9;
            /* Slate 100 - Fondo claro empresarial */
        }

        /* Estilización de Barra de Desplazamiento Minimalista */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            /* Slate 300 */
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #14532D;
            /* Verde Institucional */
        }

        @media print {
            body * {
                visibility: hidden;
            }

            .print-receipt,
            .print-receipt *,
            .printable-area,
            .printable-area * {
                visibility: visible;
            }

            .print-receipt {
                position: absolute;
                left: 0;
                top: 0;
                width: 100% !important;
                max-width: 80mm;
                margin: 0 !important;
                padding: 10px !important;
                box-sizing: border-box;
                border: 2px solid #000 !important;
            }

            .printable-area {
                position: absolute;
                left: 0;
                top: 0;
                width: 100% !important;
                margin: 0 !important;
                padding: 20px !important;
                box-sizing: border-box;
            }
        }
    </style>
