<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GUTT SYSTEM</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="apple-touch-icon" href="/favicon.svg">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#002B67">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        /* Paleta de marca GUTT COMPANY S.A.S. — navy #002B67 + cian #03CED4 (del logo).
           Punto unico de verdad del color: cambiar aqui cambia todo el sistema.
           Regla: accent-400 es solo grafico (1.95:1 sobre blanco). Para texto, accent-700. */
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#EAF1F9', 100: '#CFE0F2', 200: '#A5C4E6', 300: '#6E9BD1',
                            400: '#3D72B8', 500: '#17509C', 600: '#0A3D80', 700: '#002B67',
                            800: '#002253', 900: '#00193D', 950: '#001129'
                        },
                        accent: {
                            50: '#E6FBFC', 100: '#C2F5F7', 200: '#8DEBEE', 300: '#4FDEE3',
                            400: '#03CED4', 500: '#05AFB5', 600: '#068E93', 700: '#067A80',
                            800: '#085F63', 900: '#094B4E'
                        }
                    }
                }
            }
        };
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f1f5f9;
            /* Slate 100 - Fondo claro empresarial */
        }

        /* Estilización de Barra de Desplazamiento Minimalista */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            /* Slate 300 */
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #002B67;
            /* Navy institucional */
        }

        @media print {
            body * {
                visibility: hidden;
            }

            .print-receipt,
            .print-receipt *,
            .printable-area,
            .printable-area * {
                visibility: visible;
            }

            .print-receipt {
                position: absolute;
                left: 0;
                top: 0;
                width: 100% !important;
                max-width: 80mm;
                margin: 0 !important;
                padding: 10px !important;
                box-sizing: border-box;
                border: 2px solid #000 !important;
            }

            .printable-area {
                position: absolute;
                left: 0;
                top: 0;
                width: 100% !important;
                margin: 0 !important;
                padding: 20px !important;
                box-sizing: border-box;
            }
        }
    </style>
    <script type="importmap">
{
  "imports": {
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "recharts": "https://esm.sh/recharts@^3.6.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0"
  }
}
</script>
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>

</html>
